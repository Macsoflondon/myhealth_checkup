name: EDGE six-hourly prices

on:
  schedule:
    - cron: "32 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-price-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --prefer-offline --no-audit --fund=false
      - name: Check server-only catalogue credentials
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-supabase-service-key.mjs
      - name: Refresh exact EDGE prices
        env:
          SUPABASE_URL: https://clvuioagsgfadynuvodj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx --tsconfig tsconfig.json scripts/edge-price-sync.ts
