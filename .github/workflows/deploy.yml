name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to main supersedes an in-flight deploy, so never cancel one
# mid-publish but always finish on the latest commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Same deterministic gate as unit-tests.yml (bun install --frozen-lockfile
  # lockfile drifts from package.json or a test fails, nothing is deployed.
  test:
    uses: ./.github/workflows/unit-tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }

      # bun.lock is the only lockfile; --frozen-lockfile fails if it is out of
      # sync with package.json instead of re-resolving untested versions.
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
