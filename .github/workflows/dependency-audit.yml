name: Dependency Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 06:00 UTC to catch newly disclosed CVEs
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: bun audit (fail on high/critical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }

      # Audit bun.lock, the only lockfile, exactly as deploy.yml installs it.
      - name: Install dependencies from the committed lockfile
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run bun audit (high & critical)
        if: always()
        run: bun audit --audit-level=high

      - name: Generate JSON report
        if: always()
        run: bun audit --json > npm-audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30
