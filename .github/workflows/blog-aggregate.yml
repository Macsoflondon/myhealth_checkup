name: Blog aggregate

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The job has failed every day since it was added because this secret
      # was never set. Fail first, with the fix, instead of after npm ci with
      # a "Connect Supabase in Lovable Cloud" message that points elsewhere.
      - name: Require SUPABASE_SERVICE_ROLE_KEY
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Repository secret SUPABASE_SERVICE_ROLE_KEY is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v7
      # An anon key here fails later as row-level-security errors on
      # provider_blog_posts. This names the key's actual role and project.
      - name: Check the key is a service-role key for this project
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_SB_SECRET: "1"
        run: node scripts/check-supabase-service-key.mjs
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run blog aggregation
        env:
          SUPABASE_URL: https://clvuioagsgfadynuvodj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx --tsconfig tsconfig.json scripts/blog-sync.ts
