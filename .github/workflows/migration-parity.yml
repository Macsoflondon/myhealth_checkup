name: Migration parity

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/check-migration-parity.mjs"
      - "scripts/check-remote-migration-parity.mjs"
      - "scripts/lib/migration-parity-core.mjs"
      - ".github/workflows/migration-parity.yml"
  # Historical drift can be introduced by applying a migration through the
  # Lovable/Supabase tooling without committing a file. That touches no path and
  # opens no PR, so the path-filtered triggers above would never see it.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      # Job-level env: `secrets` is not available to step-level `if` expressions,
      # so the previous `if: ${{ secrets.SUPABASE_DB_URL != '' }}` guard could
      # never evaluate truthy and the remote half silently never ran.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "20" }

      - name: Local filesystem parity
        run: node scripts/check-migration-parity.mjs

      - name: Self-test the comparison logic against fixtures
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          npx vitest run src/lib/ci/__tests__/migration-parity.test.ts

      - name: Install psql
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Remote parity (repo ↔ supabase_migrations.schema_migrations)
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: node scripts/check-remote-migration-parity.mjs

      - name: Warn when the remote check could not run
        if: ${{ env.SUPABASE_DB_URL == '' }}
        run: |
          echo "::warning::SUPABASE_DB_URL is not configured — remote migration parity was NOT verified."
          echo "Set the repository secret to enable it. See docs/MIGRATION_RECONCILIATION.md."
