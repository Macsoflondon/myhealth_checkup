name: Build check

# Runs the exact install + build the production deploy uses (bun install --frozen-lockfile
# so a broken build is caught on the PR instead of on the deploy after merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - run: bun install --frozen-lockfile
      - run: npm run build
      - name: Output directory the deploy publishes exists
        run: test -f .output/public/index.html || ls -la .output/public
