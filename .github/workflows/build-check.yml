name: Build check

# Runs the exact install + build the production deploy uses (npm ci, Linux x64),
# so a broken build is caught on the PR instead of on the deploy after merge.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - run: npm ci --no-audit --fund=false
      - run: npm run build
      - name: Output directory the deploy publishes exists
        run: test -f .output/public/index.html || ls -la .output/public
