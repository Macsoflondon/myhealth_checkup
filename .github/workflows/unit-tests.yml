name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by deploy.yml so production only ships a commit that passes this gate.
  workflow_call:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - run: npm ci --prefer-offline --no-audit --fund=false
      # Covers, among others:
      #   src/lib/storage/__tests__/testResultsPath.test.ts  (W5 storage prefix regression)
      #   src/lib/ci/__tests__/migration-parity.test.ts      (W2 parity fixture self-test)
      # categoryMapping.test.ts queries live catalogue data and has its own
      # workflow (category-mapping-regression.yml); excluded here so this job
      # stays a deterministic, offline unit-test gate.
      - run: npx vitest run --exclude "src/components/admin/__tests__/categoryMapping.test.ts"
