name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci --prefer-offline --no-audit --fund=false
      # Covers, among others:
      #   src/lib/storage/__tests__/testResultsPath.test.ts  (W5 storage prefix regression)
      #   src/lib/ci/__tests__/migration-parity.test.ts      (W2 parity fixture self-test)
      - run: npx vitest run
