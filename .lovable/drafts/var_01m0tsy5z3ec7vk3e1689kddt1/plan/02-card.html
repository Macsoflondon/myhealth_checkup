  <rect x="40" y="30" width="200" height="240" rx="12" fill="hsl(var(--card))" stroke="hsl(var(--border))"/>
  <rect x="56" y="44" width="168" height="70" rx="8" fill="hsl(var(--muted))"/>
  <text x="140" y="82" text-anchor="middle" font-size="11" fill="hsl(var(--muted-foreground))">kit image</text>

      <path d="M0 0 L8 4 L0 8 Z" fill="hsl(var(--muted-foreground))"/>

  <text x="500" y="20" text-anchor="middle" font-size="12" fill="hsl(var(--muted-foreground))">after</text>
  <rect x="400" y="30" width="200" height="240" rx="12" fill="hsl(var(--card))" stroke="hsl(var(--border))"/>
  <rect x="416" y="44" width="168" height="70" rx="8" fill="hsl(var(--muted))"/>
  <text x="500" y="82" text-anchor="middle" font-size="11" fill="hsl(var(--muted-foreground))">kit image</text>
  <rect x="416" y="126" width="90" height="8" rx="4" fill="hsl(var(--border))"/>
  <rect x="416" y="142" width="140" height="12" rx="4" fill="hsl(var(--border))"/>
  <rect x="416" y="162" width="150" height="7" rx="3" fill="hsl(var(--border))"/>
  <rect x="416" y="173" width="120" height="7" rx="3" fill="hsl(var(--border))"/>

  <!-- new chips -->
  <rect x="416" y="190" width="70" height="16" rx="8" fill="hsl(var(--accent))"/>
  <text x="451" y="201" text-anchor="middle" font-size="10" fill="hsl(var(--accent-foreground))">48 biomarkers</text>

  <text x="538" y="201" text-anchor="middle" font-size="10" fill="hsl(var(--foreground))">~2–3 working days</text>

  <text x="466" y="223" text-anchor="middle" font-size="10" fill="hsl(var(--foreground))">Venous sample</text>

  <rect x="416" y="240" width="60" height="12" rx="4" fill="hsl(var(--border))"/>
  <rect x="516" y="234" width="68" height="22" rx="11" fill="hsl(var(--muted))"/>
  <text x="500" y="290" text-anchor="middle" font-size="11" fill="hsl(var(--muted-foreground))">chips render only when the data exists</text>
</svg>
